name: Android

on:
  push:
    paths:
      - 'android/**'
      - 'tools/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:

jobs:
  build:
    name: ساخت APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: نصب JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: نصب Android SDK
        uses: android-actions/setup-android@v3

      - name: آماده‌سازی Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: اجرای تست‌های واحد
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: ساخت APK دیباگ
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: ساخت APK ریلیز
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: بارگذاری APK
        uses: actions/upload-artifact@v4
        with:
          name: azad-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: بارگذاری گزارش تست در صورت شکست
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: android/app/build/reports/

  warp-api:
    name: بررسی API ثبت‌نام WARP
    runs-on: ubuntu-latest
    # اگر Cloudflare قالب پاسخ را عوض کند این شکست می‌خورد ولی جلوی ساخت را نمی‌گیرد
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: نصب Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: امتحان ثبت‌نام رایگان
        working-directory: tools/warpcheck
        run: go run .

  tun2socks:
    name: ساخت کتابخانه tun2socks
    runs-on: ubuntu-latest
    # هنوز هیچ کد اپلیکیشنی به این وابسته نیست، پس شکستش نباید جلوی APK را بگیرد
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: نصب JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: نصب Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: نصب Android SDK و NDK
        uses: android-actions/setup-android@v3

      - name: نصب NDK
        run: sdkmanager --install "ndk;27.2.12479018"

      - name: نصب gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest

      - name: ساخت AAR
        working-directory: tools/tun2socks
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init
          gomobile bind -v \
            -target=android/arm64,android/arm \
            -androidapi 24 \
            -o tun2socks.aar \
            .
          ls -la tun2socks.aar

      - name: بارگذاری کتابخانه
        uses: actions/upload-artifact@v4
        with:
          name: tun2socks-aar
          path: tools/tun2socks/tun2socks.aar
          if-no-files-found: error
