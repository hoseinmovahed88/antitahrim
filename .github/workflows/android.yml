name: Android

on:
  push:
    paths:
      - 'android/**'
      - 'tools/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:

jobs:
  azadcore:
    name: ساخت هسته اندروید
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: نصب JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: نصب Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: نصب Android SDK
        uses: android-actions/setup-android@v3

      - name: نصب NDK
        run: sdkmanager --install "ndk;27.2.12479018"

      - name: نصب gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest

      - name: ساخت AAR
        working-directory: tools/azadcore
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init
          gomobile bind -v \
            -target=android/arm64,android/arm \
            -androidapi 24 \
            -o azadcore.aar \
            .
          ls -la azadcore.aar

      # کد کاتلین باید دقیقاً با امضاهایی که gomobile تولید می‌کند بخواند.
      # این گام آنها را چاپ می‌کند تا حدس در کار نباشد.
      - name: چاپ رابط تولیدشده
        working-directory: tools/azadcore
        run: |
          unzip -p azadcore.aar classes.jar > /tmp/azadcore-classes.jar
          echo "===== کلاس‌های تولیدشده ====="
          unzip -l /tmp/azadcore-classes.jar | grep '\.class$' | grep -v '\$' | head -20
          echo "===== امضاها ====="
          javap -cp /tmp/azadcore-classes.jar azadcore.Azadcore || true

      - name: بارگذاری هسته
        uses: actions/upload-artifact@v4
        with:
          name: azadcore-aar
          path: tools/azadcore/azadcore.aar
          if-no-files-found: error

  build:
    name: ساخت APK
    runs-on: ubuntu-latest
    needs: azadcore
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: نصب JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: نصب Android SDK
        uses: android-actions/setup-android@v3

      - name: آماده‌سازی Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: دریافت هسته
        uses: actions/download-artifact@v4
        with:
          name: azadcore-aar
          path: android/app/libs

      - name: بررسی وجود هسته
        run: ls -la android/app/libs

      - name: اجرای تست‌های واحد
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: ساخت APK دیباگ
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: ساخت APK ریلیز
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      # ساخت با تفکیک معماری، یک فایل به ازای هر معماری تولید می‌کند.
      # نامشان به شکل app-arm64-v8a-debug.apk است و اینجا کوتاه می‌شوند.
      - name: نام‌گذاری خروجی‌ها
        run: |
          mkdir -p out
          for f in android/app/build/outputs/apk/*/*.apk; do
            base="$(basename "$f")"
            short="${base#app-}"
            cp "$f" "out/azad-${short}"
          done
          ls -la out

      - name: بارگذاری APK
        uses: actions/upload-artifact@v4
        with:
          name: azad-apk
          path: out/*.apk
          if-no-files-found: error

      # لینک مستقیم برای دانلود روی گوشی، بدون نیاز به ورود به گیت‌هاب.
      # برچسب ثابت است تا آدرس عوض نشود.
      - name: انتشار نسخه
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: آخرین ساخت آزاد
          body: |
            ساخته‌شده از کامیت ${{ github.sha }}

            **کدام فایل را بگیرم؟**

            تقریباً همه گوشی‌های امروزی arm64 هستند، پس
            `azad-arm64-v8a-debug.apk` را بگیرید.
            اگر نصب نشد یا گوشی خیلی قدیمی است، نسخه `armeabi-v7a` را امتحان کنید.

            فایل‌های `debug` گزارش تشخیصی کامل نشان می‌دهند و برای عیب‌یابی
            مناسب‌ترند. فایل‌های `release` کوچک‌ترند.

            همه با کلید دیباگ امضا شده‌اند، پس برای انتشار در فروشگاه مناسب نیستند.
          files: out/*.apk
          prerelease: true
          make_latest: false

      - name: بارگذاری گزارش تست در صورت شکست
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: android/app/build/reports/

  warp-api:
    name: بررسی API ثبت‌نام WARP
    runs-on: ubuntu-latest
    # اگر Cloudflare قالب پاسخ را عوض کند این شکست می‌خورد ولی جلوی ساخت را نمی‌گیرد
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: نصب Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: امتحان ثبت‌نام رایگان
        working-directory: tools/warpcheck
        run: go run .
